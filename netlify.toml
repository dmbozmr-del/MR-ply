# Netlify Configuration for MR Audio Player

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA redirect rule - prevents 404 on page refresh or direct URLs
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Header rules for audio streaming and seeking
[[headers]]
  for = "/audio/*"
  [headers.values]
    Accept-Ranges = "bytes"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
